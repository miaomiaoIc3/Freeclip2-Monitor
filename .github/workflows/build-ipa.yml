name: Build FreeClipMonitor IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project FreeClipMonitor.xcodeproj \
            -scheme FreeClipMonitor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/FreeClipMonitor.app Payload/
          zip -qry FreeClipMonitor.ipa Payload
          ls -lh FreeClipMonitor.ipa

      - name: Upload FreeClipMonitor.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeClipMonitor-IPA
          path: FreeClipMonitor.ipa
          retention-days: 30
