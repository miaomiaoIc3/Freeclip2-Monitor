name: FreeClipMonitor
options:
  bundleIdPrefix: com.freeclip
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "5"

targets:
  FreeClipMonitor:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Shared
    entitlements:
      path: App/FreeClipMonitor.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.freeclip.monitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freeclip.monitor
        INFOPLIST_KEY_CFBundleDisplayName: "FreeClip 2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "FreeClip 2"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: "用于获取 FreeClip 2 耳机与充电盒电量。"
        UIBackgroundModes:
          - bluetooth-central
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: FreeClipMonitorWidget
        embed: true

  FreeClipMonitorWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
      - path: Shared
    entitlements:
      path: Widget/FreeClipMonitorWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.freeclip.monitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freeclip.monitor.widget
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "FreeClip 2"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
