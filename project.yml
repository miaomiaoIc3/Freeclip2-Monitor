name: FreeClipMonitor
options:
  bundleIdPrefix: com.freeclip
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"

targets:
  FreeClipMonitor:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Shared
    entitlements:
      path: App/FreeClipMonitor.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freeclip.monitor
        INFOPLIST_KEY_CFBundleDisplayName: "FreeClip 2"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "FreeClip 2"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSBluetoothAlwaysUsageDescription: "用于扫描华为 FreeClip 2 的 FDEE 广播与 FD21 服务，读取充电盒与双耳真实电量。"
        UIBackgroundModes:
          - bluetooth-central
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: FreeClipMonitorWidget
        embed: true

  FreeClipMonitorWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
      - path: Shared
    entitlements:
      path: Widget/FreeClipMonitorWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freeclip.monitor.widget
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "FreeClip 2 电量"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
